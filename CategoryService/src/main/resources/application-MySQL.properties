# ===================================================================
# 1. DATABASE CONNECTION CONFIGURATION
# ===================================================================
# JDBC URL for the MySQL instance (replace 'your_database_name' with your actual schema name)
spring.datasource.url=jdbc:mysql://localhost:3306/ECOMMERCE_BACKEND
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# Credentials to access the database
spring.datasource.username=root
spring.datasource.password=root

# The modern MySQL JDBC Driver class name (mandatory for older Spring Boot versions, auto-detected in newer ones)


# ===================================================================
# 2. JPA / HIBERNATE CONFIGURATION
# ===================================================================
# DDL-auto strategy: options include update, create, create-drop, validate, none
spring.jpa.hibernate.ddl-auto=update

# Explicitly specifies the modern MySQL dialect for Hibernate
#spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Set to true to print executed SQL queries to the console log
spring.jpa.show-sql=true

# Set to true to format the printed SQL for easier reading
spring.jpa.properties.hibernate.format_sql=true
